name: spike-confluence

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script to run
        type: choice
        options: [confluence, adf-check, plan-check]
        default: confluence

permissions:
  contents: read

concurrency:
  group: spike-confluence
  cancel-in-progress: false

jobs:
  spike:
    name: Confluence spike
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run spike
        env:
          SCRIPT: ${{ inputs.script }}
          CONFLUENCE_SITE: ${{ vars.CONFLUENCE_SITE }}
          CONFLUENCE_SPIKE_EMAIL: ${{ vars.CONFLUENCE_SPIKE_EMAIL }}
          CONFLUENCE_TEST_SPACE: ${{ vars.CONFLUENCE_TEST_SPACE }}
          CONFLUENCE_EA_SPACE: ${{ vars.CONFLUENCE_EA_SPACE }}
          CONFLUENCE_EA_FOLDER: ${{ vars.CONFLUENCE_EA_FOLDER }}
          CONFLUENCE_SPIKE_READ_TOKEN: ${{ secrets.CONFLUENCE_SPIKE_READ_TOKEN }}
          CONFLUENCE_SPIKE_WRITE_TOKEN: ${{ secrets.CONFLUENCE_SPIKE_WRITE_TOKEN }}
        run: |
          node --version
          node "spikes/$SCRIPT.mjs"
