name: spike-confluence

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script to run
        type: choice
        options: [confluence, adf-check, plan-check, publish-check]
        default: confluence

permissions:
  contents: read

concurrency:
  group: spike-confluence
  cancel-in-progress: false

jobs:
  spike:
    name: Confluence spike
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build image
        if: inputs.script == 'publish-check'
        run: docker build -t docs-sync:spike .
      - name: Run spike
        env:
          SCRIPT: ${{ inputs.script }}
          CONFLUENCE_SITE: ${{ vars.CONFLUENCE_SITE }}
          CONFLUENCE_SPIKE_EMAIL: ${{ vars.CONFLUENCE_SPIKE_EMAIL }}
          CONFLUENCE_TEST_SPACE: ${{ vars.CONFLUENCE_TEST_SPACE }}
          CONFLUENCE_EA_SPACE: ${{ vars.CONFLUENCE_EA_SPACE }}
          CONFLUENCE_EA_FOLDER: ${{ vars.CONFLUENCE_EA_FOLDER }}
          CONFLUENCE_SPIKE_READ_TOKEN: ${{ secrets.CONFLUENCE_SPIKE_READ_TOKEN }}
          CONFLUENCE_SPIKE_WRITE_TOKEN: ${{ secrets.CONFLUENCE_SPIKE_WRITE_TOKEN }}
        run: |
          node --version
          node "spikes/$SCRIPT.mjs"
