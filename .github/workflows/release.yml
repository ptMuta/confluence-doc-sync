name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v1.0.0
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ptmuta/git-confluence-sync

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # push the release tag and create the release
      packages: write # push the image to GHCR
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t docs-sync:release .
      - name: Scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea docs-sync:release --fail-on high --only-fixed
      - name: Push
        id: push
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag docs-sync:release "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Tag and release
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s#^  image: Dockerfile\$#  image: docker://$IMAGE@$DIGEST#" action.yml
          grep -q "image: docker://$IMAGE@$DIGEST" action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $VERSION" action.yml
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION" --notes "Image: \`$IMAGE@$DIGEST\`"
