name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v1.0.0 or v1.0.0-rc.1
        required: true
  schedule:
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ptmuta/git-confluence-sync

jobs:
  version:
    name: Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT" == schedule ]]; then
            version="nightly-$(date -u +%Y%m%d)"
            last=$(gh release list -R "$GITHUB_REPOSITORY" --json tagName -q '[.[].tagName | select(startswith("nightly-"))][0] // ""')
            if [[ -n "$last" && "$(gh api "repos/$GITHUB_REPOSITORY/commits/$last" -q '.parents[0].sha')" == "$GITHUB_SHA" ]]; then
              echo "main has not changed since $last"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            version="$INPUT"
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "version must look like v1.2.3 or v1.2.3-rc.1"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.event_name == 'schedule' && 'nightly' || 'release' }}
    permissions:
      contents: write # push the release tag and create the release
      packages: write # push the image to GHCR
      id-token: write # sign the attestation
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t docs-sync:release .
      - name: Scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea docs-sync:release --fail-on high --only-fixed
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag docs-sync:release "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Tag and release
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s#^  image: Dockerfile\$#  image: docker://$IMAGE@$DIGEST#" action.yml
          grep -q "image: docker://$IMAGE@$DIGEST" action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $VERSION" action.yml
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/tags/$VERSION"
          kind=$([[ "$VERSION" =~ ^v[0-9.]+$ ]] && echo --latest || echo --prerelease)
          gh release create "$VERSION" "$kind" --verify-tag --generate-notes --title "$VERSION" --notes "Image: \`$IMAGE@$DIGEST\`"

  cleanup:
    name: Clean up pre-releases
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # delete old pre-releases and their tags
      packages: write # delete their images
    env:
      KEEP_NIGHTLIES: 7
      GH_TOKEN: ${{ github.token }}
      PACKAGE: users/${{ github.repository_owner }}/packages/container/git-confluence-sync/versions
    steps:
      - run: |
          tags=$(gh release list -R "$GITHUB_REPOSITORY" -L 1000 --json tagName -q '.[].tagName')
          finals=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" || true)
          old=$(
            grep '^nightly-' <<< "$tags" | sort -r | tail -n "+$((KEEP_NIGHTLIES + 1))"
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' <<< "$tags" | while read -r tag; do
              if grep -qx "${tag%-rc.*}" <<< "$finals"; then echo "$tag"; fi
            done
          ) || true
          for tag in $old; do
            echo "Deleting $tag"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag -y
            for id in $(gh api "$PACKAGE" --paginate -q ".[] | select(.metadata.container.tags | index(\"$tag\")) | .id"); do
              gh api -X DELETE "$PACKAGE/$id"
            done
          done
