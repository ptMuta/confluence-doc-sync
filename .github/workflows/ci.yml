name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - run: npm run knip
      - run: npm run build

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color .github/workflows/*.yml examples/*.yml
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --persona=pedantic . examples/docs-sync.yml examples/docs-sync-approve.yml

  sast:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.181.1@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2 semgrep scan --config p/typescript --config p/nodejsscan --config p/github-actions --config p/dockerfile --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint --error --metrics=off

  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|\.docs-sync/|docs-sync\.lock$|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Container image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --ignore DL3008 - < Dockerfile
      - name: Build
        run: docker build -t docs-sync:ci .
      - name: Smoke test
        run: |
          sample() { docker run --rm -v "$PWD/test/fixtures/$1:/github/workspace:ro" -w /github/workspace "${@:2}" docs-sync:ci; }
          quiet() { "$@" | sed 's/^::/  /'; return "${PIPESTATUS[0]}"; }
          sample good -e INPUT_MODE=check
          if quiet sample bad -e INPUT_MODE=check; then
            echo "check mode passed the bad sample repo"
            exit 1
          fi
          if quiet sample good -e INPUT_MODE=check -e INPUT_CONFLUENCE-CLIENT-SECRET=dummy; then
            echo "check mode accepted a credential"
            exit 1
          fi
      - name: Render samples
        run: |
          mkdir -p renders/a renders/b
          render() { docker run --rm -v "$PWD/test/fixtures:/in:ro" -v "$PWD/renders/$1:/out" docs-sync:ci render "${@:3}" /out "/in/diagrams/$2.drawio"; }
          render a showcase
          render b showcase
          cmp renders/a/showcase.png renders/b/showcase.png
          for theme in studio midnight bold sketch blueprint nord carbon aurora pastel; do
            mkdir -p "renders/a/$theme"
            docker run --rm -v "$PWD/test/fixtures:/in:ro" -v "$PWD/renders/a/$theme:/out" docs-sync:ci render --theme "$theme" /out /in/diagrams/{showcase,cloud-icons,network-devices}.drawio
          done
          if render b unsafe; then
            echo "an unsafe diagram rendered"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagram-samples
          path: renders/a
          retention-days: 7
      - name: Scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea docs-sync:ci --fail-on high --only-fixed

  edge:
    name: Edge image
    needs: [node, workflows, sast, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # sign the attestation
      attestations: write # store the attestation
    env:
      IMAGE: ghcr.io/ptmuta/confluence-doc-sync
    outputs:
      image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:edge" .
          docker push "$IMAGE:edge"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:edge")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  docs:
    name: Docs
    needs: [node, workflows, sast, edge]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.node.result == 'success' &&
      needs.workflows.result == 'success' && needs.sast.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.edge.result)
    permissions:
      contents: read
      actions: read # download the plan artifact
      packages: read # pull the edge image
      attestations: read # verify the edge image
    uses: ./.github/workflows/docs-sync.yml
    with:
      image: ${{ needs.edge.result == 'success' && needs.edge.outputs.image || '' }}
