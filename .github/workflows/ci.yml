name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - run: npm run knip
      - run: npm run build

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --persona=pedantic .

  sast:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.181.1@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2 semgrep scan --config p/typescript --config p/nodejsscan --config p/github-actions --config p/dockerfile --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint --error --metrics=off

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --ignore DL3008 - < Dockerfile
      - name: Build
        run: docker build -t docs-sync:ci .
      - name: Smoke test
        run: |
          sample() { docker run --rm -v "$PWD/test/fixtures/$1:/github/workspace:ro" -w /github/workspace "${@:2}" docs-sync:ci; }
          sample good -e INPUT_MODE=check
          if sample bad -e INPUT_MODE=check; then
            echo "check mode passed the bad sample repo"
            exit 1
          fi
          if sample good -e INPUT_MODE=check -e INPUT_CONFLUENCE-TOKEN=dummy; then
            echo "check mode accepted a token"
            exit 1
          fi
      - name: Render samples
        run: |
          mkdir -p renders/a renders/b
          render() { docker run --rm -v "$PWD/test/fixtures:/in:ro" -v "$PWD/renders/$1:/out" docs-sync:ci render "${@:3}" /out "/in/diagrams/$2.drawio"; }
          render a showcase
          render b showcase
          cmp renders/a/showcase.png renders/b/showcase.png
          for theme in studio midnight bold sketch blueprint nord carbon aurora pastel; do
            mkdir -p "renders/a/$theme"
            docker run --rm -v "$PWD/test/fixtures:/in:ro" -v "$PWD/renders/a/$theme:/out" docs-sync:ci render --theme "$theme" /out /in/diagrams/{showcase,cloud-icons,network-devices}.drawio
          done
          if render b unsafe; then
            echo "an unsafe diagram rendered"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagram-samples
          path: renders/a
          retention-days: 7
      - name: Scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea docs-sync:ci --fail-on high --only-fixed
