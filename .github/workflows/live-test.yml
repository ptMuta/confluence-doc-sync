name: live-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-test
  cancel-in-progress: false

jobs:
  confluence:
    name: Confluence test site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: docker build -t docs-sync:live .
      - env:
          CONFLUENCE_SITE: ${{ vars.CONFLUENCE_SITE }}
          CONFLUENCE_TEST_SPACE: ${{ vars.CONFLUENCE_TEST_SPACE }}
          CONFLUENCE_EA_SPACE: ${{ vars.CONFLUENCE_EA_SPACE }}
          CONFLUENCE_EA_FOLDER: ${{ vars.CONFLUENCE_EA_FOLDER }}
          CONFLUENCE_TEST_READ_CLIENT_ID: ${{ secrets.CONFLUENCE_TEST_READ_CLIENT_ID }}
          CONFLUENCE_TEST_READ_CLIENT_SECRET: ${{ secrets.CONFLUENCE_TEST_READ_CLIENT_SECRET }}
          CONFLUENCE_TEST_WRITE_CLIENT_ID: ${{ secrets.CONFLUENCE_TEST_WRITE_CLIENT_ID }}
          CONFLUENCE_TEST_WRITE_CLIENT_SECRET: ${{ secrets.CONFLUENCE_TEST_WRITE_CLIENT_SECRET }}
        run: node test/live/confluence.mjs
