version: 2
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 7
